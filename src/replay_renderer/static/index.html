<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malody V 回放轨道播放器</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">LOCAL REPLAY LAB</p><h1>Malody V 回放轨道播放器</h1><p id="appInfo" class="app-info">Server · by Winter_Melon</p><p>选择原生 Key 谱面包与对应回放，所有数据仅在本机进程内处理。</p></header>
    <section class="panel upload-panel">
      <label>谱面包 .mcz / .osz<input id="chartFile" type="file" accept=".mcz,.osz"></label>
      <label>回放 .mrv<input id="replayFile" type="file" accept=".mrv"></label>
      <button id="analyze">载入并分析</button>
      <span id="status">等待文件</span>
    </section>
    <section id="workspace" class="workspace hidden">
      <aside class="panel sidebar">
        <div><p class="eyebrow">TRACK</p><h2 id="title">—</h2><p id="meta"></p></div>
        <div id="summary" class="summary"></div>
        <div class="legend"><span class="perfect">Perfect</span><span class="cool">Cool</span><span class="good">Good</span><span class="miss">Miss / 额外输入</span></div>
        <label>轨道宽度 <span class="setting"><input id="trackWidth" type="range" min="240" max="1200" value="480"><input id="trackWidthNumber" type="number" min="240" max="1200" step="10" value="480"><span>px</span></span></label>
        <label>轨道高度 <span class="setting"><input id="trackHeight" type="range" min="360" max="1000" value="720"><input id="trackHeightNumber" type="number" min="360" max="1000" step="10" value="720"><span>px</span></span></label>
        <label>下落速度 <span class="setting"><input id="fallSpeed" type="range" min="100" max="2000" value="600"><input id="fallSpeedNumber" type="number" min="100" max="2000" step="10" value="600"><span>px/s</span></span></label>
        <label>音频延迟微调 <span class="setting"><input id="audioDelay" type="range" min="-1000" max="1000" step="1" value="-300"><input id="audioDelayNumber" type="number" min="-1000" max="1000" step="10" value="-300"><span>ms</span></span></label>
        <section class="export-controls">
          <p class="eyebrow">EXPORT MP4</p>
          <label class="check"><input id="exportChartInfo" type="checkbox">显示谱面信息</label>
          <label class="check"><input id="exportRealtime" type="checkbox">显示实时判定信息</label>
          <button id="exportVideo">导出 MP4</button>
          <progress id="exportProgress" class="hidden" max="1" value="0"></progress>
          <p id="exportStatus" class="export-status">固定 60 FPS，包含谱面音频</p>
        </section>
        <p id="warnings" class="warnings"></p>
      </aside>
      <section class="player">
        <canvas id="track" width="480" height="720"></canvas>
        <div class="transport panel">
          <section class="density-section" aria-label="谱面密度">
            <div class="density-header"><span>NOTE DENSITY · 1s</span><strong>当前 <span id="densityCurrent">0</span> / 最大 <span id="densityMaximum">0</span></strong></div>
            <div class="density-chart-row">
              <div id="densityAxis" class="density-axis" aria-hidden="true"></div>
              <div id="densityPlot" class="density-plot">
                <canvas id="densityCurve" aria-label="谱面 Note 密度曲线"></canvas>
                <canvas id="densityCursor" aria-hidden="true"></canvas>
                <div id="densityTooltip" class="density-tooltip hidden"></div>
              </div>
            </div>
          </section>
          <div class="progress-row"><span aria-hidden="true"></span><input id="progress" type="range" min="0" max="1" step="1" value="0"></div>
          <div class="transport-controls">
            <button id="play">播放</button><button id="restart">重新开始</button>
            <span id="clock">00:00.000 / 00:00.000</span><label class="time-input">时间 <input id="currentTimeInput" type="number" step="1000" value="0"> ms</label>
          </div>
        </div>
      </section>
      <aside class="panel realtime-panel">
        <p class="eyebrow">ACCURACY</p>
        <strong id="realtimeAccuracy">100.00%</strong>
        <dl><div><dt>Perfect</dt><dd id="realtimePerfect">0</dd></div><div><dt>Cool</dt><dd id="realtimeCool">0</dd></div><div><dt>Good</dt><dd id="realtimeGood">0</dd></div><div><dt>Miss</dt><dd id="realtimeMiss">0</dd></div></dl>
      </aside>
    </section>
    <footer><a href="/third-party.html" target="_blank" rel="noopener">第三方软件许可</a></footer>
  </main>
  <audio id="audio" preload="auto"></audio>
  <script src="/app.js"></script>
</body>
</html>
