[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "malody-replay-renderer"
version = "5.1"
description = "Local Malody V replay track renderer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow==12.3.0",
    "imageio-ffmpeg==0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replay_renderer = ["static/*.html", "static/*.css", "static/*.js"]
